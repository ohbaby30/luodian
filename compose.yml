services:
  luodian:
    build: .
    restart: unless-stopped
    ports:
      - "${LUODIAN_PORT:-3088}:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      COOKIE_SECURE: "false"
    volumes:
      - luodian_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  luodian_data:
    name: luodian_data

